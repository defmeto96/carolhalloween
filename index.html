<!-- React + ReactDOM via CDN -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<style>
  :root{
    --bg1:#040203; --bg2:#0b0708; --accent:#d4af37; --muted:#cfc0a0; --card:#0d0d0d;
  }
  html,body{height:100%;margin:0;font-family: Georgia, "Times New Roman", serif;background:radial-gradient(ellipse at 20% 10%, rgba(212,175,55,0.03), transparent 20%), linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--muted);}
  #root{max-width:1100px;margin:18px auto;padding:18px;}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .title{color:var(--accent);font-weight:800;letter-spacing:1px}
  .subtitle{font-size:12px;color:#efe2b8}
  .layout{display:grid;grid-template-columns:1fr 360px;gap:18px;margin-top:18px}
  .stage{position:relative;min-height:640px;border-radius:12px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.6);background:linear-gradient(180deg,#080808,#0b0b0b)}
  .altar{position:absolute;inset:0;pointer-events:none;opacity:.14;background-image:
    radial-gradient(circle at 20% 10%, rgba(212,175,55,0.06), transparent 8%),
    radial-gradient(circle at 80% 80%, rgba(212,175,55,0.03), transparent 12%);}
  .candle{position:absolute;left:28px;bottom:24px;width:44px;height:130px;background:linear-gradient(180deg,#1a120a,#2b1a0d);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.8)}
  .cardFrame{width:420px;max-width:92%;height:280px;border-radius:14px;padding:18px;margin:36px auto;background:linear-gradient(180deg,#090909,#0e0e0e);border:1px solid rgba(212,175,55,.08);box-shadow:0 18px 60px rgba(0,0,0,.65);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .45s cubic-bezier(.2,.9,.3,1),opacity .3s}
  .card-hidden{opacity:0;transform:scale(.96) translateY(18px)}
  .card-anim{animation:popIn .6s cubic-bezier(.2,.9,.3,1)}
  @keyframes popIn{0%{transform:translateY(18px) scale(.96) rotate(-2deg);opacity:0}60%{transform:translateY(-6px) scale(1.02) rotate(1deg);opacity:1}100%{transform:translateY(0) scale(1) rotate(0)}}
  .card-cat{font-size:13px;color:#f3e7c0;margin-bottom:6px}
  .card-title{font-size:20px;color:var(--accent);font-weight:800;letter-spacing:.6px;margin-bottom:8px;text-align:center}
  .card-pt{font-size:16px;color:#f6e6be;text-align:center;margin-bottom:8px}
  .card-en{font-size:13px;color:#ddd;text-align:center}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;z-index:3;position:relative}
  button{background:transparent;border:1px solid rgba(212,175,55,.12);color:var(--accent);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}
  .primary{background:linear-gradient(90deg,#231800,#3a2b00);border-color:rgba(212,175,55,.4)}
  .invoca{background:linear-gradient(90deg,#3b2200,#442a00);border-color:rgba(212,175,55,.6);padding:12px 14px}
  .sidebar{background:linear-gradient(180deg,#0b0b0b,#0a0a0a);padding:16px;border-radius:12px;min-height:640px;box-shadow:0 6px 20px rgba(0,0,0,.6)}
  label{display:block;font-size:13px;margin-bottom:6px;color:var(--muted)}
  select,input,textarea{width:100%;padding:8px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.03);color:var(--muted)}
  .list{max-height:220px;overflow:auto;padding:6px;background:linear-gradient(180deg,#070707,#0b0b0b);border-radius:8px}
  footer{margin-top:14px;text-align:center;color:#bdbdbd;font-size:12px}
  .small{font-size:13px;color:#cfc0a0}
  .lang-toggle{border-radius:999px;padding:6px 10px;background:rgba(212,175,55,0.05);font-weight:800;color:var(--accent)}
  @media (max-width:980px){ .layout{grid-template-columns:1fr} .candle{left:12px;bottom:6px}}
</style>
</head>

    {cat:"Eclipse", titlePT:"Doce Proibido", titleEN:"Forbidden Sweet", textPT:"Dê um doce; em troca, receba algo surpresa.", textEN:"Give a sweet; receive a surprise in return.", rare:true},
    {cat:"Eclipse", titlePT:"Sombra do Desejo", titleEN:"Shadow of Desire", textPT:"Diga o primeiro pensamento proibido (ou invente).", textEN:"Say the first forbidden thought or invent one.", rare:true},
    {cat:"Eclipse", titlePT:"O Último Brinde", titleEN:"The Last Toast", textPT:"Todos brindam 'Pelo Caos Sombrio!'; quem não brindar, paga mico.", textEN:"All toast 'For Dark Chaos!'; who doesn't toast, pays a dare.", rare:true},
    {cat:"Eclipse", titlePT:"Véu das Ilusões", titleEN:"Veil of Illusions", textPT:"Fique 'invisível' — ninguém pode te escolher por 1 rodada.", textEN:"Become 'invisible' — no one can pick you for 1 round.", rare:true},
    {cat:"Eclipse", titlePT:"Mão do Destino", titleEN:"Hand of Destiny", textPT:"Você escolhe quem joga as próximas duas cartas.", textEN:"You choose who draws the next two cards.", rare:true},
    {cat:"Eclipse", titlePT:"Névoa da Loucura", titleEN:"Mist of Madness", textPT:"Todos sussurram até a próxima rodada.", textEN:"Everyone whispers until next round.", rare:true},
    {cat:"Eclipse", titlePT:"Eclipse Total", titleEN:"Total Eclipse", textPT:"Tirem uma foto ritualística e brindem.", textEN:"Take a ritual photo and toast together.", rare:true},
    {cat:"Eclipse", titlePT:"O Chamado do Caos", titleEN:"Call of Chaos", textPT:"Reveja uma carta jogada e repita seu efeito.", textEN:"Pick a played card and repeat its effect.", rare:true}
  ];
  // ensure exactly 105 by duplicating some if needed (should be 105 already)
  return deck;
})();

/* ---------- Small audio helpers (WebAudio synth) ---------- */
function playTone(freq=880,dur=100,type='sine'){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = 0.007;
    o.connect(g); g.connect(ctx.destination); o.start();
    setTimeout(()=>{ o.stop(); ctx.close(); }, dur);
  }catch(e){}
}

/* ---------- App component ---------- */
function App(){
  const [lang, setLang] = useState('PT'); // PT or EN
  const [deck, setDeck] = useState([]);
  const [discard, setDiscard] = useState([]);
  const [current, setCurrent] = useState(null);
  const [showEN, setShowEN] = useState(true);
  const [soundOn, setSoundOn] = useState(true);
  const [chaosOn, setChaosOn] = useState(false);
  const [favorites, setFavorites] = useState([]);
  const [filter, setFilter] = useState('all');
  const [mode, setMode] = useState('casual');
  const [activeConsequences, setActiveConsequences] = useState([]);
  const [counts, setCounts] = useState({deck:0,discard:0,fav:0});

  // init on mount
  useEffect(()=>{
    const saved = localStorage.getItem('codex_state');
    if(saved){
      try{
        const s = JSON.parse(saved);
        setDeck(s.deck || [...BASE_DECK]);
        setDiscard(s.discard || []);
        setFavorites(s.favorites || []);
        setChaosOn(!!s.chaosOn);
        setActiveConsequences(s.activeConsequences || []);
        setLang(s.lang || 'PT');
      }catch(e){
        setDeck([...BASE_DECK]);
      }
    } else {
      setDeck([...BASE_DECK]);
    }
  },[]);

  // persist
  useEffect(()=>{ localStorage.setItem('codex_state', JSON.stringify({deck,discard,favorites,chaosOn,activeConsequences,lang})); setCounts({deck:deck.length, discard:discard.length, fav:favorites.length}); }, [deck,discard,favorites,chaosOn,activeConsequences,lang]);

  // helper to shuffle array copy
  function shuffleArr(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  // draw one card
  function draw(peek=false){
    if(deck.length === 0){
      if(discard.length === 0){ alert(lang==='PT' ? 'Baralho vazio.' : 'Deck empty.'); return; }
      const newDeck = shuffleArr(discard);
      setDeck(newDeck); setDiscard([]); // then continue
    }
    // build visible list per filter/mode
    let visible = deck.filter(c => filter==='all' || c.cat===filter);
    if(mode==='paquera') visible = visible.filter(c => c.cat==='Picantes' || c.cat==='Gostosuras');
    if(mode==='bebida') visible = visible.filter(c => ['Consequências','Caos','Sombras','Gostosuras'].includes(c.cat));
    if(chaosOn) visible = visible.concat(BASE_DECK.filter(x=>x.rare)); // allow rares when chaos
    if(visible.length === 0){ alert(lang==='PT' ? 'Nenhuma carta com esse filtro.' : 'No cards for this filter.'); return; }
    const idx = Math.floor(Math.random()*visible.length);
    const card = visible[idx];
    // animate / show
    setCurrent(null);
    setTimeout(()=>{ setCurrent(card); playTone(800,120,'sine'); }, 120);
    if(!peek){
      // remove first occurrence from deck
      const pos = deck.indexOf(card);
      if(pos >= 0){
        const nd = [...deck]; nd.splice(pos,1); setDeck(nd);
      } else {
        // if card was a rare from BASE_DECK not in deck, do nothing to deck
      }
      setDiscard(prev=>[card, ...prev]);
      if(card.cat==='Consequências') setActiveConsequences(prev=>[card, ...prev]);
    } else {
      playTone(440,260,'triangle');
    }
  }

  function shuffleDeck(){
    setDeck(prev => shuffleArr(prev));
    if(soundOn) playTone(880,100,'sine');
  }

  function toggleChaos(){
    setChaosOn(prev => !prev);
    if(!chaosOn) playTone(440,220,'triangle'); else playTone(660,140,'square');
  }

  function toggleLanguage(){
    setLang(prev => prev==='PT' ? 'EN' : 'PT');
  }

  function toggleSound(){ setSoundOn(s => !s); }

  function addFavorite(){
    if(!current) return alert(lang==='PT' ? 'Nenhuma carta para favoritar.' : 'No card to favorite.');
    setFavorites(prev => { const n=[current,...prev]; localStorage.setItem('codex_faves', JSON.stringify(n)); return n; });
  }

  function resetDeck(){
    if(!confirm(lang==='PT' ? 'Resetar deck para o padrão?' : 'Reset deck to default?')) return;
    setDeck([...BASE_DECK]); setDiscard([]); setFavorites([]); setActiveConsequences([]); setChaosOn(false);
  }

  function exportDeck(){
    const payload = {deck, discard, favorites, activeConsequences, chaosOn};
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download='codex_deck_export.json'; a.click(); URL.revokeObjectURL(url);
  }

  function importDeck(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try{
        const parsed = JSON.parse(e.target.result);
        setDeck(parsed.deck || []); setDiscard(parsed.discard || []); setFavorites(parsed.favorites || []); setActiveConsequences(parsed.activeConsequences || []); setChaosOn(!!parsed.chaosOn);
        alert(lang==='PT' ? 'Deck importado.' : 'Deck imported.');
      }catch(err){ alert(lang==='PT' ? 'Erro ao importar.' : 'Import error.'); }
    };
    reader.readAsText(file);
  }

  function fillTo105(){
    const all = [...deck, ...discard];
    const baseNonRare = BASE_DECK.filter(c=>!c.rare);
    while(all.length < 105){ all.push(JSON.parse(JSON.stringify(baseNonRare[Math.floor(Math.random()*baseNonRare.length)]))); }
    setDeck(all); alert(lang==='PT' ? 'Deck preenchido até 105.' : 'Deck filled to 105.');
  }

  function renderText(card){
    if(!card) return {title:'—', pt: lang==='PT' ? 'Toque em Sortear carta' : 'Tap Draw card', en: lang==='EN' ? 'Tap Draw card' : ''};
    return {title: lang==='PT' ? card.titlePT || card.titleEN : card.titleEN || card.titlePT, pt: card.textPT, en: card.textEN};
  }

  // populate filter options (unique cats)
  const categories = Array.from(new Set([...deck.map(d=>d.cat), ...BASE_DECK.map(d=>d.cat)]));

  return e('div',null,
    e('header',null,
      e('div',null, e('div',{className:'title'}, 'Codex Profano — Edição Sombria do Caos'), e('div',{className:'subtitle'}, lang==='PT' ? 'O Altar Místico' : 'The Mystic Altar')),
      e('div',null,
        e('button',{onClick:toggleLanguage, className:'lang-toggle'}, lang),
        e('button',{onClick:toggleSound, style:{marginLeft:8}}, soundOn ? '🔊' : '🔈')
      )
    ),
    e('div',{className:'layout'},
      e('section',{className:'stage'},
        e('div',{className:'altar'}),
        e('div',{className:'candle'}),
        e('div',{className:'controls'},
          e('button',{className:'primary', onClick:()=>draw(false)}, lang==='PT' ? '🎴 Sortear carta' : '🎴 Draw card'),
          e('button',{onClick:()=>draw(true)}, lang==='PT' ? '👁️ Espiar (peek)' : '👁️ Peek'),
          e('button',{onClick:shuffleDeck}, lang==='PT' ? '🔀 Embaralhar' : '🔀 Shuffle'),
          e('div',{style:{flex:1}}),
          e('button',{onClick:toggleChaos, className:'invoca'}, chaosOn ? (lang==='PT' ? '🕯️ Caos Invocado (ON)' : '🕯️ Chaos ON') : (lang==='PT' ? '🕯️ Invocar o Caos' : '🕯️ Invoke Chaos'))
        ),
        e('div',{className:'cardFrame' + (current ? ' card-anim' : ' card-hidden'), id:'cardFrame'},
          e('div',{className:'card-cat'}, current ? (current.cat) : (lang==='PT' ? '—' : '—')),
          e('div',{className:'card-title'}, renderText(current).title),
          e('div',{className:'card-pt'}, current ? (lang==='PT' ? current.textPT : current.textPT) : (lang==='PT' ? 'Toque em Sortear carta para começar.' : 'Tap Draw card to start.')),
          e('div',{className:'card-en', style:{display: (lang==='PT' ? 'none' : 'block')}}, current ? (lang==='EN' ? current.textEN : current.textEN) : ''),
          e('div',{style:{marginTop:10}},
            e('button',{onClick:()=>setShowEN(s=>!s)}, lang==='PT' ? 'Virar / Esconder tradução' : 'Toggle translation'),
            e('button',{onClick:addFavorite, style:{marginLeft:8}}, '⭐ ' + (lang==='PT' ? 'Favorita' : 'Favorite'))
          )
        ),
        e('div',{style:{display:'flex',gap:8,justifyContent:'center',marginTop:12}},
          e('button',{onClick:()=>{ setActiveConsequences([]); alert(lang==='PT' ? 'Consequências limpas.' : 'Consequences cleared.'); }}, lang==='PT' ? 'Limpar Consequências' : 'Clear consequences'),
          e('button',{onClick:()=>alert(activeConsequences.length? activeConsequences.map((c,i)=>`${i+1}. ${c.titlePT}`).join('\\n') : (lang==='PT' ? 'Nenhuma consequência ativa.' : 'No active consequences.'))}, lang==='PT' ? 'Ver Consequências Ativas' : 'View Active Consequences')
        )
      ),
      e('aside',{className:'sidebar'},
        e('div',{className:'section'}, e('label',null, lang==='PT' ? 'Filtrar por categoria' : 'Filter by category'),
          e('select',{value:filter, onChange: (ev)=>setFilter(ev.target.value)},
            e('option',{value:'all'}, lang==='PT' ? 'Todas' : 'All'),
            categories.map(c => e('option',{key:c, value:c}, c))
          ),
          e('div',{style:{marginTop:8}},
            e('label',null, lang==='PT' ? 'Modo' : 'Mode'),
            e('select',{value:mode, onChange:(ev)=>setMode(ev.target.value)},
              e('option',{value:'casual'}, lang==='PT' ? 'Casual (todas)' : 'Casual (all)'),
              e('option',{value:'paquera'}, lang==='PT' ? 'Paquera (picantes + gostosuras)' : 'Flirt (spicy + treats)'),
              e('option',{value:'bebida'}, lang==='PT' ? 'Vamos beber (consequências)' : 'Drink mode (consequences)'),
              e('option',{value:'caos'}, lang==='PT' ? 'Caos total' : 'Chaos mode')
            )
          )
        ),
        e('div',{className:'section'},
          e('label',null, lang==='PT' ? 'Adicionar carta (rápido)' : 'Quick add card'),
          e('input',{id:'iptPT', placeholder: (lang==='PT' ? 'Título PT' : 'Title PT')}),
          e('input',{id:'iptEN', placeholder: (lang==='PT' ? 'Título EN' : 'Title EN'), style:{marginTop:6}}),
          e('textarea',{id:'txtPT', rows:2, placeholder:(lang==='PT'? 'Texto PT':'Text PT'), style:{marginTop:6}}),
          e('textarea',{id:'txtEN', rows:2, placeholder:(lang==='PT'? 'Texto EN':'Text EN'), style:{marginTop:6}}),
          e('select',{id:'selCat', style:{marginTop:6}},
            ['Gostosuras','Picantes','Travessuras','Consequências','Sombras','Caos','Eclipse'].map(c => e('option',{key:c,value:c}, c))
          ),
          e('div',{style:{display:'flex',gap:8,marginTop:8}},
            e('button',{onClick:()=>{ const tpt=document.getElementById('iptPT').value.trim(); const ten=document.getElementById('iptEN').value.trim(); const txtpt=document.getElementById('txtPT').value.trim(); const txten=document.getElementById('txtEN').value.trim(); const cat=document.getElementById('selCat').value; if(!tpt||!txtpt){ alert(lang==='PT' ? 'Preencha título PT e texto PT.' : 'Fill PT title and PT text.'); return; } const obj={cat, titlePT:tpt, titleEN:ten||tpt, textPT:txtpt, textEN:txten||txtpt}; setDeck(prev=>[obj,...prev]); alert(lang==='PT' ? 'Carta adicionada.' : 'Card added.'); }}, lang==='PT' ? '➕ Adicionar' : '➕ Add'),
            e('button',{onClick:exportDeck}, lang==='PT' ? '📤 Exportar' : '📤 Export'),
            e('label',{style:{display:'inline-block',padding:'6px 8px',border:'1px solid rgba(255,255,255,0.03)',borderRadius:8,cursor:'pointer',marginLeft:8}}, lang==='PT' ? '📥 Importar' : '📥 Import', e('input',{type:'file',style:{display:'none'}, onChange:(ev)=>importDeck(ev.target.files[0])}))
          )
        ),
        e('div',{className:'section'},
          e('label',null, lang==='PT' ? 'Favoritas' : 'Favorites'),
          e('div',{className:'list'}, favorites.length ? favorites.map((f,i)=> e('div',{key:i, style:{marginBottom:6}}, `[${f.cat}] ${lang==='PT'?f.titlePT:f.titleEN}`)) : e('div',null, lang==='PT' ? 'Nenhuma favorita' : 'No favorites'))
        ),
        e('div',{className:'section'},
          e('label',null, lang==='PT' ? 'Baralho' : 'Deck'),
          e('div',null, `${counts.deck || deck.length} cartas disponíveis · ${counts.discard || discard.length} descartadas`),
          e('div',{style:{marginTop:8,display:'flex',gap:8}},
            e('button',{onClick:resetDeck}, lang==='PT' ? '🔄 Resetar' : '🔄 Reset'),
            e('button',{onClick:()=>{ fillTo105(); }}, '✴️ ' + (lang==='PT' ? 'Completar p/105' : 'Fill to 105'))
          )
        ),
        e('div',{className:'section'}, e('label',null, lang==='PT' ? 'Sons' : 'Sounds'), e('div',null,
          e('button',{onClick:()=>{ setSoundOn(s=>!s); if(soundOn) playTone(300,100); }}, soundOn ? '🔊 On' : '🔈 Off')
        )),
        e('div',{style:{marginTop:8}}, e('small',{className:'small'}, lang==='PT' ? 'Dica: Instale como app via menu do navegador.' : 'Tip: Install via browser menu.'))
      )
    ),
    e('footer',null, e('div',null, lang==='PT' ? 'Criado por uma criatura mágica, demoníaca, amaldiçoada e louca.' : 'Created by a magical, demonic, cursed and mad creature.'))
  );
}

/* mount */
ReactDOM.createRoot(document.getElementById('root')).render(e(App));

/* PWA: register a basic service worker stored as a blob for offline caching */
if('serviceWorker' in navigator){
  const swCode = `
self.addEventListener('install', ev => {
  ev.waitUntil(caches.open('codex-v1').then(cache=>cache.addAll(['./','./index.html'])).catch(()=>{}));
  self.skipWaiting();
});
self.addEventListener('activate', ev => ev.waitUntil(self.clients.claim()));
self.addEventListener('fetch', ev => ev.respondWith(fetch(ev.request).catch(()=>caches.match(ev.request))));
`;
  const swBlob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).then(()=>console.log('ServiceWorker registered')).catch(e=>console.warn('SW error', e));
}

/* small helper tone for button actions */
function playTone(freq=880,dur=100,type='sine'){ try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); const g=ctx.createGain(); o.type=type; o.frequency.value=freq; g.gain.value=0.007; o.connect(g); g.connect(ctx.destination); o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, dur);}catch(e){} }

</script>
